<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бібліотека OFM</title>
    <style>
        :root { --primary: #5d4037; --accent: #8d6e63; --bg: #f4f1ea; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        h1, h2 { color: var(--primary); text-align: center; }

        /* Панель адміністратора */
        .admin-section { background: #fafafa; border: 1px dashed var(--accent); padding: 25px; border-radius: 8px; margin-bottom: 25px; display: none; }
        
        .admin-section input, .admin-section select { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }

        button { padding: 12px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 16px; }
        .btn-toggle { background: var(--primary); color: white; width: 100%; margin-bottom: 20px; }
        .btn-add { background: #4caf50; color: white; width: 100%; margin-top: 10px; }
        .btn-reserve { background: #2196f3; color: white; font-size: 14px; }

        #search { width: 100%; padding: 14px; margin: 20px 0; border: 2px solid var(--accent); border-radius: 6px; font-size: 16px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--accent); color: white; }
        
        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; display: inline-block; }
        .status-available { background: #c8e6c9; color: #2e7d32; }
        .status-reserved { background: #ffecb3; color: #f57f17; }
        .status-borrowed { background: #ffcdd2; color: #c62828; }

        #orderModal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 25px; border-radius: 10px; width: 320px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>⛪ Монастирська Бібліотека</h1>
    <button class="btn-toggle" onclick="toggleAdmin()">⚙️ Панель бібліотекаря</button>

    <div id="adminPanel" class="admin-section">
        <h2>Додати нову книгу</h2>
        <input type="text" id="title" placeholder="Назва книги *">
        <input type="text" id="author" placeholder="Автор">
        <input type="number" id="year" placeholder="Рік видання" value="2026">
        <select id="lang">
            <option value="Українська">Українська</option>
            <option value="Російська">Російська</option>
            <option value="Польська">Польська</option>
            <option value="Італійська">Італійська</option>
            <option value="Англійська">Англійська</option>
            <option value="Латинська">Латинська</option>
            <option value="Німецька">Німецька</option>
            <option value="Французька">Французька</option>
        </select>
        <input type="text" id="shelf" placeholder="Місце на полиці">
        <select id="status">
            <option value="В наявності">В наявності</option>
            <option value="Позичено">Позичено</option>
        </select>
        <button class="btn-add" id="addBtn" onclick="addBook()">✅ Записати в базу</button>
    </div>

    <input type="text" id="search" onkeyup="filterTable()" placeholder="🔍 Пошук за назвою, автором або мовою...">

    <div style="overflow-x: auto;">
        <table id="bookTable">
            <thead>
                <tr><th>Назва</th><th>Автор</th><th>Рік</th><th>Мова</th><th>Місце</th><th>Статус</th><th>Дія</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<div id="orderModal">
    <div class="modal-content">
        <h3>Замовлення книги</h3>
        <p id="modalBookTitle" style="font-weight:bold; color:var(--primary);"></p>
        <input type="text" id="clientName" placeholder="Ваше Ім'я та Прізвище">
        <input type="email" id="clientEmail" placeholder="Ваш Email">
        <button id="confirmOrderBtn" style="background:#4caf50; color:white; width:100%" onclick="submitOrder()">Підтвердити</button>
        <button id="cancelOrderBtn" style="background:#ccc; width:100%; margin-top:5px;" onclick="closeModal()">Скасувати</button>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxj9bpzmeEEhs98QHP052aecXmUZH9zEfCML4c-DOxjUuW2yWSw1lc0LTYJLb44ptKG/exec'; 
    const SECRET_PASS = 'ofm';
    let currentBook = null;
    let isAuthorized = false;

    function toggleAdmin() {
        if (!isAuthorized) {
            if (prompt("Введіть пароль:") === SECRET_PASS) {
                isAuthorized = true;
                document.getElementById("adminPanel").style.display = "block";
            }
        } else {
            let s = document.getElementById("adminPanel").style;
            s.display = s.display === "none" ? "block" : "none";
        }
    }

    async function loadBooks() {
        try {
            const r = await fetch(SCRIPT_URL);
            const d = await r.json();
            const tb = document.querySelector("#bookTable tbody");
            tb.innerHTML = "";
            d.slice(1).reverse().forEach(row => {
                const tr = document.createElement("tr");
                row.slice(0,6).forEach((cell, i) => {
                    const td = document.createElement("td");
                    if (i === 5) {
                        let cls = "";
                        if (cell === "В наявності") cls = "status-available";
                        else if (cell === "Зарезервовано") cls = "status-reserved";
                        else cls = "status-borrowed";
                        td.innerHTML = `<span class="status-badge ${cls}">${cell}</span>`;
                    } else td.textContent = cell;
                    tr.appendChild(td);
                });
                const actionTd = document.createElement("td");
                if (row[5] === "В наявності") {
                    // Використовуємо JSON.stringify для безпечної передачі назви з лапками
                    actionTd.innerHTML = `<button class="btn-reserve" onclick='openModal(${JSON.stringify(row[0])}, ${JSON.stringify(row[1])})'>Замовити</button>`;
                } else {
                    actionTd.innerHTML = `<small style="color:gray">${row[6] || 'Зайнято'}</small>`;
                }
                tr.appendChild(actionTd);
                tb.appendChild(tr);
            });
        } catch (e) { console.error("Помилка завантаження:", e); }
    }

    function openModal(title, author) {
        currentBook = { title, author };
        document.getElementById("modalBookTitle").textContent = title;
        document.getElementById("orderModal").style.display = "block";
    }

    function closeModal() { 
        document.getElementById("orderModal").style.display = "none"; 
        document.getElementById("confirmOrderBtn").disabled = false;
        document.getElementById("confirmOrderBtn").textContent = "Підтвердити";
    }

    async function submitOrder() {
        const name = document.getElementById("clientName").value;
        const email = document.getElementById("clientEmail").value;
        if (!name || !email) return alert("Заповніть всі поля!");

        const btn = document.getElementById("confirmOrderBtn");
        btn.disabled = true;
        btn.textContent = "Надсилаємо...";

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    action: "reserve", 
                    title: currentBook.title, 
                    author: currentBook.author, 
                    userName: name, 
                    userEmail: email 
                })
            });
            alert("Замовлення надіслано! Бібліотекар скоро зв'яжеться з вами.");
            closeModal();
            loadBooks();
        } catch (e) {
            alert("Помилка при замовленні. Спробуйте пізніше.");
            btn.disabled = false;
            btn.textContent = "Підтвердити";
        }
    }

    function addBook() {
        const t = document.getElementById('title').value;
        if (!t) return alert("Назва книги обов'язкова!");
        const btn = document.getElementById('addBtn');
        btn.disabled = true;
        btn.textContent = "Зберігаємо...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                password: SECRET_PASS,
                title: t,
                author: document.getElementById('author').value,
                year: document.getElementById('year').value,
                lang: document.getElementById('lang').value,
                shelf: document.getElementById('shelf').value,
                status: document.getElementById('status').value
            })
        }).then(() => {
            document.getElementById('title').value = "";
            document.getElementById('author').value = "";
            btn.disabled = false;
            btn.textContent = "✅ Записати в базу";
            loadBooks();
        });
    }

    function filterTable() {
        let v = document.getElementById("search").value.toUpperCase();
        document.querySelectorAll("#bookTable tbody tr").forEach(r => {
            r.style.display = r.textContent.toUpperCase().includes(v) ? "" : "none";
        });
    }

    window.onload = loadBooks;
    setInterval(loadBooks, 60000); // Оновлювати раз на хвилину
</script>
</body>
</html>
